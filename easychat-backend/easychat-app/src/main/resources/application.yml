server:
  port: 8080

spring:
  application:
    name: easychat
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://gz-cdb-ns0ptu89.sql.tencentcdb.com:26090/ai-chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectTimeout=10000&socketTimeout=60000&tcpKeepAlive=true}
    username: username
    password: password
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      keep-alive: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000

      filters: stat,wall,slf4j

      stat-view-servlet:
        enabled: true
        login-username: ${DRUID_STAT_USERNAME:admin}
        login-password: ${DRUID_STAT_PASSWORD:admin}
  # Elasticsearch config is optional.
  # elasticsearch:
  #   uris: http://localhost:9200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl
  global-config:
    db-config:
      id-type: auto

# LangChain4j LLM config
easychat:
  llm:
    api-key: ${OPENAI_API_KEY:xxxxxxxxxxxxxxx}
    base-url: ${OPENAI_BASE_URL:https://api.deepseek.com/v1}
    model-name: ${OPENAI_MODEL:deepseek-chat}
    temperature: 0.7
    max-tokens: 2000
